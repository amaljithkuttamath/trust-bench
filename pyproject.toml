[project]
name = "trust-bench"
version = "0.1.0"
description = "Interpretability toolkit for LLMs"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformer-lens>=2.0",
    "sae-lens>=4.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "click>=8.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]
# circuit-tracer is not yet published to PyPI; install manually from source when needed
# circuit = [
#     "circuit-tracer",
# ]

[project.scripts]
trust-bench = "trust_bench.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["research/", "src/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
