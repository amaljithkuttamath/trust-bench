name: Bug Report
description: Report a bug in Trust Bench
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run `trust-bench survey ...`\n2. ..."
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: "llama-3.1-8b"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Apple M2, Python 3.11, uv 0.6"
